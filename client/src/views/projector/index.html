<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassLive Pro - Projector View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-8 flex flex-col justify-between">
    
    <!-- Top: QR Code lớn & Đồng hồ đếm ngược 15 phút -->
    <div class="flex justify-between items-center bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-2xl">
        <div class="flex items-center space-x-6">
            <div class="bg-white p-3 rounded-2xl shadow-inner">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=ClassLive4829" alt="QR Code" class="w-28 h-28">
            </div>
            <div>
                <p class="text-slate-400 text-sm font-medium">Quét mã QR để tham gia phòng</p>
                <h1 class="text-4xl font-extrabold text-indigo-400 mt-1 tracking-wider">Mã PIN: <span class="text-white">4829</span></h1>
            </div>
        </div>

        <div class="text-right">
            <p class="text-slate-400 text-xs uppercase tracking-widest font-bold mb-1">Thời gian trình bày</p>
            <div id="timer" class="text-6xl font-mono font-bold text-green-400">15:00</div>
        </div>
    </div>

    <!-- Center: Top câu hỏi được upvote nhiều nhất -->
    <div class="my-6 flex-1">
        <h2 class="text-lg font-bold text-slate-300 mb-4 flex items-center">
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 mr-2 animate-ping"></span> Top Câu Hỏi Chất Vấn Nổi Bật
        </h2>
        <div id="topQuestions" class="space-y-3">
            <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center shadow-md">
                <p class="text-lg font-medium text-slate-100">Cơ chế WebSocket reconnect khi đổi từ WiFi sang 4G xử lý thế nào?</p>
                <div class="bg-indigo-600/30 text-indigo-400 font-bold px-4 py-2 rounded-lg border border-indigo-500/30">
                    👍 12 Votes
                </div>
            </div>
        </div>
    </div>

    <!-- Khung Biểu Đồ Cột/Radar Công Bố Kết Quả Rubric (Mặc định ẩn, hiện khi Host bấm mở) -->
    <div id="chartContainer" class="hidden bg-slate-900 p-6 rounded-2xl border border-slate-800 mb-2 shadow-2xl">
        <h3 class="text-center text-lg font-bold text-slate-200 mb-4">📊 BIỂU ĐỒ TỔNG HỢP ĐIỂM TRUNG BÌNH RUBRIC</h3>
        <div class="h-52 flex justify-center">
            <canvas id="rubricChart"></canvas>
        </div>
    </div>

    <script>
        // Đồng hồ đếm ngược 15 phút (Đổi vàng khi < 3p, nhấp nháy đỏ khi < 1p)
        let totalSeconds = 15 * 60;
        const timerEl = document.getElementById('timer');

        const timerInterval = setInterval(() => {
            totalSeconds--;
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            if (totalSeconds <= 180 && totalSeconds > 60) {
                timerEl.className = "text-6xl font-mono font-bold text-amber-400 animate-pulse";
            } else if (totalSeconds <= 60) {
                timerEl.className = "text-6xl font-mono font-bold text-red-500 animate-bounce";
            }
            if (totalSeconds <= 0) clearInterval(timerInterval);
        }, 1000);

        // Khởi tạo biểu đồ Chart.js
        const ctx = document.getElementById('rubricChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['1. Nội dung', '2. Trình bày', '3. Demo', '4. Trả lời'],
                datasets: [{
                    label: 'Điểm trung bình (1-5★)',
                    data: [4.5, 4.2, 4.8, 4.0],
                    backgroundColor: '#6366f1',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { y: { min: 0, max: 5, ticks: { color: '#94a3b8' } }, x: { ticks: { color: '#94a3b8' } } },
                plugins: { legend: { display: false } }
            }
        });

        // Lắng nghe tín hiệu từ Dashboard Host để mở biểu đồ
        window.addEventListener('storage', (e) => {
            if (e.key === 'show_result' && e.newValue === 'true') {
                document.getElementById('chartContainer').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
