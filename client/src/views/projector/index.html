<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassLive Pro - Projector View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-8 flex flex-col justify-between">
    
    <div class="flex justify-between items-center bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-2xl">
        <div class="flex items-center space-x-6">
            <div class="bg-white p-3 rounded-2xl shadow-inner">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=ClassLive4829" alt="QR Code" class="w-28 h-28">
            </div>
            <div>
                <p class="text-slate-400 text-sm font-medium">Quét mã QR để tham gia phòng</p>
                <h1 class="text-4xl font-extrabold text-indigo-400 mt-1 tracking-wider">Mã PIN: <span class="text-white">4829</span></h1>
            </div>
        </div>

        <div class="text-right">
            <p class="text-slate-400 text-xs uppercase tracking-widest font-bold mb-1">Thời gian trình bày</p>
            <div id="timer" class="text-6xl font-mono font-bold text-green-400">15:00</div>
        </div>
    </div>

    <div class="my-6 flex-1">
        <h2 class="text-lg font-bold text-slate-300 mb-4 flex items-center">
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 mr-2 animate-ping"></span> Top Câu Hỏi Chất Vấn Nổi Bật
        </h2>
        <div id="topQuestions" class="space-y-3">
            <div class="text-slate-500 italic text-sm">Chưa có câu hỏi nào...</div>
        </div>
    </div>

    <div id="chartContainer" class="hidden bg-slate-900 p-6 rounded-2xl border border-slate-800 mb-2 shadow-2xl">
        <h3 class="text-center text-lg font-bold text-slate-200 mb-4">📊 BIỂU ĐỒ TỔNG HỢP ĐIỂM TRUNG BÌNH RUBRIC</h3>
        <div class="h-52 flex justify-center">
            <canvas id="rubricChart"></canvas>
        </div>
    </div>

    <script>
        let ws = null;
        let seq = 1;
        let questions = [];

        const ctx = document.getElementById('rubricChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['1. Nội dung', '2. Trình bày', '3. Demo', '4. Trả lời'],
                datasets: [{
                    label: 'Điểm trung bình (1-5★)',
                    data: [0, 0, 0, 0],
                    backgroundColor: '#6366f1',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { 
                    y: { min: 0, max: 5, ticks: { color: '#94a3b8' } }, 
                    x: { ticks: { color: '#94a3b8' } } 
                },
                plugins: { legend: { display: false } }
            }
        });

        function initWebSocket() {
            const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProto}//${location.host || 'localhost:8080'}/ws`;
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: "room.join",
                    roomCode: "4829",
                    seq: seq++,
                    timestamp: Date.now(),
                    payload: { role: "projector", clientName: "Projector Screen" }
                }));
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    const { type, payload } = message;

                    if (type === 'question.broadcast') {
                        questions.unshift({ id: payload.id, text: payload.content, votes: payload.votes || 0 });
                        renderTopQuestions();
                    } else if (type === 'question.voted') {
                        const q = questions.find(item => item.id === payload.questionId);
                        if (q) { q.votes = payload.newVotes; renderTopQuestions(); }
                    } else if (type === 'rating.summary') {
                        // Bung biểu đồ ngay khi nhận rating.summary hoặc rating.publish từ server
                        document.getElementById('chartContainer').classList.remove('hidden');
                        const avg = payload.averages;
                        chart.data.datasets[0].data = [avg.content || 0, avg.presentation || 0, avg.demo || 0, avg.qa || 0];
                        chart.update();
                    } else if (type === 'timer.sync') {
                        const remaining = payload.duration - payload.elapsed;
                        const mins = Math.floor(remaining / 60);
                        const secs = remaining % 60;
                        const timerEl = document.getElementById('timer');
                        timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                        // Đổi màu vàng (<3 phút) và đỏ nhấp nháy (<1 phút)
                        if (remaining <= 180 && remaining > 60) {
                            timerEl.className = "text-6xl font-mono font-bold text-amber-400 animate-pulse";
                        } else if (remaining <= 60) {
                            timerEl.className = "text-6xl font-mono font-bold text-red-500 animate-bounce";
                        } else {
                            timerEl.className = "text-6xl font-mono font-bold text-green-400";
                        }
                    }
                } catch (e) { console.error("Lỗi parse JSON:", e); }
            };

            ws.onclose = () => setTimeout(initWebSocket, 3000);
        }

        function renderTopQuestions() {
            const container = document.getElementById('topQuestions');
            const sorted = [...questions].sort((a, b) => b.votes - a.votes).slice(0, 3);
            if (sorted.length === 0) return;
            container.innerHTML = sorted.map(q => `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center shadow-md">
                    <p class="text-lg font-medium text-slate-100">${escapeHtml(q.text)}</p>
                    <div class="bg-indigo-600/30 text-indigo-400 font-bold px-4 py-2 rounded-lg border border-indigo-500/30 shrink-0 ml-4">👍 ${q.votes} Votes</div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        initWebSocket();
    </script>
</body>
</html>
