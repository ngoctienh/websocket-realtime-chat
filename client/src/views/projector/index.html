<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassLive Pro - Projector View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-8 flex flex-col justify-between">
    
    <!-- Top: QR Code lớn & Đồng hồ đếm ngược 15 phút -->
    <div class="flex justify-between items-center bg-slate-900/80 p-6 rounded-2xl border border-slate-800 shadow-2xl">
        <div class="flex items-center space-x-6">
            <div class="bg-white p-3 rounded-2xl shadow-inner">
                <img id="qrCodeImg" src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=ClassLive4829" alt="QR Code" class="w-28 h-28">
            </div>
            <div>
                <p class="text-slate-400 text-sm font-medium">Quét mã QR để tham gia phòng</p>
                <h1 class="text-4xl font-extrabold text-indigo-400 mt-1 tracking-wider">Mã PIN: <span id="pinDisplay" class="text-white">4829</span></h1>
            </div>
        </div>

        <div class="text-right">
            <p class="text-slate-400 text-xs uppercase tracking-widest font-bold mb-1">Thời gian trình bày</p>
            <div id="timer" class="text-6xl font-mono font-bold text-green-400">15:00</div>
        </div>
    </div>

    <!-- Center: Top câu hỏi được upvote nhiều nhất -->
    <div class="my-6 flex-1">
        <h2 class="text-lg font-bold text-slate-300 mb-4 flex items-center">
            <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 mr-2 animate-ping"></span> Top Câu Hỏi Chất Vấn Nổi Bật
        </h2>
        <div id="topQuestions" class="space-y-3">
            <!-- Dynamic Questions -->
        </div>
    </div>

    <!-- Khung Biểu Đồ Cột Rubric -->
    <div id="chartContainer" class="hidden bg-slate-900 p-6 rounded-2xl border border-slate-800 mb-2 shadow-2xl">
        <h3 class="text-center text-lg font-bold text-slate-200 mb-4">📊 BIỂU ĐỒ TỔNG HỢP ĐIỂM TRUNG BÌNH RUBRIC</h3>
        <div class="h-52 flex justify-center">
            <canvas id="rubricChart"></canvas>
        </div>
    </div>

    <script>
        let ws = null;
        let questions = [];

        // Đồng hồ đếm ngược 15 phút
        let totalSeconds = 15 * 60;
        const timerEl = document.getElementById('timer');

        const timerInterval = setInterval(() => {
            totalSeconds--;
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            if (totalSeconds <= 180 && totalSeconds > 60) {
                timerEl.className = "text-6xl font-mono font-bold text-amber-400 animate-pulse";
            } else if (totalSeconds <= 60) {
                timerEl.className = "text-6xl font-mono font-bold text-red-500 animate-bounce";
            }
            if (totalSeconds <= 0) clearInterval(timerInterval);
        }, 1000);

        // Khởi tạo Chart.js
        const ctx = document.getElementById('rubricChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['1. Nội dung', '2. Trình bày', '3. Demo', '4. Trả lời'],
                datasets: [{
                    label: 'Điểm trung bình (1-5★)',
                    data: [0, 0, 0, 0],
                    backgroundColor: '#6366f1',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: { 
                    y: { min: 0, max: 5, ticks: { color: '#94a3b8' } }, 
                    x: { ticks: { color: '#94a3b8' } } 
                },
                plugins: { legend: { display: false } }
            }
        });

        // Tích hợp WebSocket Realtime
        function initWebSocket() {
            ws = new WebSocket('ws://localhost:8080/ws');

            ws.onopen = () => {
                console.log('Projector View connected to WebSocket!');
                ws.send(JSON.stringify({
                    action: "JOIN_ROOM",
                    payload: { pin: "4829", role: "projector" }
                }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    // Cập nhật câu hỏi
                    if (data.type === 'UPDATE_QUESTIONS' || data.questions) {
                        questions = data.questions || [];
                        renderTopQuestions();
                    }

                    // Công bố kết quả Rubric
                    if (data.action === 'SHOW_RUBRIC_RESULT' || data.type === 'SHOW_RUBRIC_RESULT') {
                        document.getElementById('chartContainer').classList.remove('hidden');
                        if (data.rubricData) {
                            chart.data.datasets[0].data = data.rubricData;
                            chart.update();
                        }
                    }
                } catch (e) {
                    console.error("Lỗi parse dữ liệu WebSocket:", e);
                }
            };

            ws.onclose = () => setTimeout(initWebSocket, 3000);
        }

        function renderTopQuestions() {
            const container = document.getElementById('topQuestions');
            // Sắp xếp câu hỏi theo lượt vote giảm dần và lấy top 3
            const sorted = [...questions].sort((a, b) => (b.votes || 0) - (a.votes || 0)).slice(0, 3);
            
            if (sorted.length === 0) {
                container.innerHTML = `<div class="text-slate-500 italic text-sm">Chưa có câu hỏi nào...</div>`;
                return;
            }

            container.innerHTML = sorted.map(q => `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center shadow-md">
                    <p class="text-lg font-medium text-slate-100">${escapeHtml(q.text)}</p>
                    <div class="bg-indigo-600/30 text-indigo-400 font-bold px-4 py-2 rounded-lg border border-indigo-500/30 shrink-0 ml-4">
                        👍 ${q.votes || 0} Votes
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        initWebSocket();
    </script>
</body>
</html>
