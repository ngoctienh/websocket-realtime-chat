<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassLive Pro - Student View</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-3 flex justify-center items-center">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-4 flex flex-col h-[92vh] relative overflow-hidden">
        
        <!-- Yêu cầu 7: Báo trạng thái mạng (Xanh/Vàng/Đỏ) -->
        <div class="flex items-center justify-between border-b pb-2 mb-3">
            <div class="flex items-center space-x-2">
                <span id="netIndicator" class="w-3 h-3 rounded-full bg-green-500 transition-all duration-300"></span>
                <span id="netText" class="text-xs text-slate-600 font-medium">Kết nối ổn định</span>
            </div>
            <span class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-md font-mono font-bold">PIN: <span id="roomPinDisplay">----</span></span>
        </div>

        <!-- Yêu cầu 1: Màn hình vào phòng (Nhập PIN hoặc QR) -->
        <div id="joinScreen" class="flex-1 flex flex-col justify-center items-center py-6">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mb-4 font-bold shadow-inner">
                🎓
            </div>
            <h2 class="text-xl font-bold text-slate-800 mb-1">Tham gia phòng học</h2>
            <p class="text-xs text-slate-500 mb-6 text-center">Nhập mã PIN 4 số từ màn hình chiếu hoặc quét mã QR</p>
            
            <input type="text" id="pinInput" maxlength="4" placeholder="VD: 4829" class="w-48 text-center text-2xl font-bold tracking-widest border-2 border-slate-200 rounded-xl py-2.5 mb-4 focus:outline-none focus:border-indigo-600 transition">
            
            <button onclick="joinRoom()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl text-sm shadow-md transition">
                Vào Phòng Thảo Luận
            </button>
        </div>

        <!-- Màn hình tương tác chính (Ẩn khi chưa vào phòng) -->
        <div id="mainScreen" class="hidden flex-1 flex flex-col overflow-hidden">
            
            <!-- Tab chuyển đổi chức năng -->
            <div class="flex border-b mb-3">
                <button onclick="switchTab('qna')" id="tabQna" class="flex-1 pb-2 text-xs font-bold border-b-2 border-indigo-600 text-indigo-600 transition">Hỏi Đáp & Upvote</button>
                <button onclick="switchTab('rubric')" id="tabRubric" class="flex-1 pb-2 text-xs font-bold border-b-2 border-transparent text-slate-400 transition">Chấm Rubric (1-5★)</button>
            </div>

            <!-- Tab 1: Q&A & Upvote -->
            <div id="contentQna" class="flex-1 flex flex-col overflow-hidden">
                <!-- Yêu cầu 2: Form nhập câu hỏi nhanh & nút tick Ẩn danh -->
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-3 shrink-0">
                    <textarea id="questionText" rows="2" placeholder="Gõ câu hỏi chất vấn nhóm thuyết trình..." class="w-full bg-transparent text-xs text-slate-800 focus:outline-none resize-none"></textarea>
                    <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-200">
                        <label class="flex items-center space-x-1.5 cursor-pointer">
                            <input type="checkbox" id="anonCheckbox" class="rounded text-indigo-600 w-3.5 h-3.5 focus:ring-indigo-500">
                            <span class="text-xs text-slate-600 font-medium">Gửi ẩn danh</span>
                        </label>
                        <button onclick="sendQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3.5 py-1.5 rounded-lg font-semibold transition shadow-sm">
                            Gửi câu hỏi
                        </button>
                    </div>
                </div>

                <!-- Yêu cầu 3: Danh sách câu hỏi Realtime -->
                <div id="questionList" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                    <!-- Dynamic Questions -->
                </div>
            </div>

            <!-- Yêu cầu 5: Giao diện chấm điểm Rubric 1-5 sao cho 4 tiêu chí -->
            <div id="contentRubric" class="hidden flex-1 flex flex-col justify-between overflow-y-auto py-1">
                <div class="space-y-3 pr-1">
                    <p class="text-xs text-slate-500 font-medium">Đánh giá khách quan các tiêu chí của nhóm:</p>
                    
                    <div class="rubric-group bg-slate-50 p-3 rounded-xl border" data-criterion="content">
                        <span class="text-xs font-bold text-slate-700 block mb-1">1. Nội dung báo cáo</span>
                        <div class="stars flex space-x-2" data-value="0"></div>
                    </div>
                    <div class="rubric-group bg-slate-50 p-3 rounded-xl border" data-criterion="presentation">
                        <span class="text-xs font-bold text-slate-700 block mb-1">2. Kỹ năng trình bày</span>
                        <div class="stars flex space-x-2" data-value="0"></div>
                    </div>
                    <div class="rubric-group bg-slate-50 p-3 rounded-xl border" data-criterion="demo">
                        <span class="text-xs font-bold text-slate-700 block mb-1">3. Sản phẩm / Demo thực tế</span>
                        <div class="stars flex space-x-2" data-value="0"></div>
                    </div>
                    <div class="rubric-group bg-slate-50 p-3 rounded-xl border" data-criterion="qa">
                        <span class="text-xs font-bold text-slate-700 block mb-1">4. Trả lời phản biện</span>
                        <div class="stars flex space-x-2" data-value="0"></div>
                    </div>
                </div>

                <button onclick="submitRubric()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-3 rounded-xl transition shadow-md mt-3 shrink-0">
                    Gửi Đánh Giá Rubric
                </button>
            </div>

        </div>
    </div>

    <script>
        // Danh sách câu hỏi lưu trữ tạm thời trên client
        let questions = [
            { id: 101, author: 'Nguyễn Hải Long', text: 'Cơ chế WebSocket reconnect khi đổi mạng xử lý thế nào?', votes: 4, isAnon: false },
            { id: 102, author: 'Ẩn danh', text: 'Ứng dụng có hỗ trợ chạy trên trình duyệt Safari của iOS không?', votes: 2, isAnon: true }
        ];

        let ws = null;
        let currentPin = '';

        // Yêu cầu 6: WebSocket Client với cơ chế tự động kết nối lại (Auto-reconnect) kết nối thực tế tới cổng 8080
        function initWebSocket(pin) {
            ws = new WebSocket('ws://localhost:8080/ws');

            ws.onopen = () => {
                updateNetworkStatus('online');
                console.log('Đã kết nối thành công với WebSocket Server!');
                
                // Gửi thông tin tham gia phòng lên server
                ws.send(JSON.stringify({
                    action: "JOIN_ROOM",
                    payload: { pin: pin, role: "student" }
                }));
            };

            ws.onclose = () => {
                updateNetworkStatus('offline');
                setTimeout(() => initWebSocket(pin), 3000); // Thử kết nối lại sau 3 giây
            };

            ws.onerror = () => {
                updateNetworkStatus('connecting');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleServerMessage(data);
                } catch (e) {
                    console.error("Lỗi parse dữ liệu từ server:", e);
                }
            };
        }

        // Xử lý gói tin nhận về từ server
        function handleServerMessage(data) {
            console.log('Nhận dữ liệu từ server:', data);
            if (data.type === 'UPDATE_QUESTIONS' || data.action === 'UPDATE_QUESTIONS' || data.questions) {
                questions = data.questions || questions;
                renderQuestions();
            }
        }

        // Yêu cầu 7: Cập nhật giao diện trạng thái mạng
        function updateNetworkStatus(status) {
            const indicator = document.getElementById('netIndicator');
            const text = document.getElementById('netText');
            if (status === 'online') {
                indicator.className = "w-3 h-3 rounded-full bg-green-500 animate-pulse";
                text.textContent = "Kết nối ổn định";
            } else if (status === 'connecting') {
                indicator.className = "w-3 h-3 rounded-full bg-amber-400 animate-ping";
                text.textContent = "Đang kết nối lại...";
            } else {
                indicator.className = "w-3 h-3 rounded-full bg-red-500";
                text.textContent = "Mất kết nối mạng";
            }
        }

        function joinRoom() {
            const pin = document.getElementById('pinInput').value.trim();
            if (pin.length === 4) {
                currentPin = pin;
                document.getElementById('roomPinDisplay').textContent = pin;
                document.getElementById('joinScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
                
                renderQuestions();
                initRubricStars();
                initWebSocket(pin);
            } else {
                alert('Vui lòng nhập chính xác mã PIN gồm 4 chữ số!');
            }
        }

        // Chuyển tab giao diện
        function switchTab(tab) {
            const isQna = tab === 'qna';
            document.getElementById('contentQna').classList.toggle('hidden', !isQna);
            document.getElementById('contentRubric').classList.toggle('hidden', isQna);
            
            document.getElementById('tabQna').className = isQna ? 'flex-1 pb-2 text-xs font-bold border-b-2 border-indigo-600 text-indigo-600 transition' : 'flex-1 pb-2 text-xs font-bold border-b-2 border-transparent text-slate-400 transition';
            document.getElementById('tabRubric').className = !isQna ? 'flex-1 pb-2 text-xs font-bold border-b-2 border-indigo-600 text-indigo-600 transition' : 'flex-1 pb-2 text-xs font-bold border-b-2 border-transparent text-slate-400 transition';
        }

        // Yêu cầu 3: Render danh sách câu hỏi realtime
        function renderQuestions() {
            const container = document.getElementById('questionList');
            container.innerHTML = questions.map(q => {
                const votedKey = `voted_${q.id}`;
                const hasVoted = localStorage.getItem(votedKey) === 'true';
                
                return `
                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex justify-between items-start gap-2">
                        <div class="flex-1">
                            <span class="text-[10px] font-bold ${q.isAnon ? 'text-slate-400 italic' : 'text-slate-700'}">${q.author}</span>
                            <p class="text-xs text-slate-800 mt-0.5 leading-relaxed">${escapeHtml(q.text)}</p>
                        </div>
                        <button onclick="upvote(${q.id})" ${hasVoted ? 'disabled' : ''} class="flex flex-col items-center justify-center px-2.5 py-1 rounded-lg border transition shrink-0 ${hasVoted ? 'bg-indigo-50 border-indigo-300 opacity-60' : 'bg-slate-50 hover:bg-indigo-50 border-slate-200'}">
                            <span class="text-xs font-bold text-indigo-600">${q.votes}</span>
                            <span class="text-[9px] text-slate-400">${hasVoted ? 'Đã vote' : 'Vote'}</span>
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Yêu cầu 2: Gửi câu hỏi nhanh qua WebSocket thật
        function sendQuestion() {
            const input = document.getElementById('questionText');
            const isAnon = document.getElementById('anonCheckbox').checked;
            const text = input.value.trim();

            if (!text) {
                alert('Vui lòng nhập nội dung câu hỏi!');
                return;
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: "SEND_QUESTION",
                    payload: {
                        pin: currentPin,
                        text: text,
                        isAnon: isAnon,
                        author: isAnon ? 'Ẩn danh' : 'Phạm Văn Dũng'
                    }
                }));

                // Thêm hiển thị cục bộ ngay lập tức để tối ưu trải nghiệm UI
                const newQ = {
                    id: Date.now(),
                    author: isAnon ? 'Ẩn danh' : 'Phạm Văn Dũng',
                    text: text,
                    votes: 0,
                    isAnon: isAnon
                };
                questions.unshift(newQ);
                input.value = '';
                document.getElementById('anonCheckbox').checked = false;
                renderQuestions();
            } else {
                alert('Mất kết nối tới server, vui lòng thử lại!');
            }
        }

        // Yêu cầu 4: Upvote câu hỏi (Mỗi máy chỉ vote 1 lần bằng localStorage)
        function upvote(id) {
            const votedKey = `voted_${id}`;
            if (localStorage.getItem(votedKey) === 'true') return;

            const q = questions.find(item => item.id === id);
            if (q) {
                q.votes++;
                localStorage.setItem(votedKey, 'true');
                renderQuestions();

                // Gửi thông báo upvote lên server nếu có kết nối
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        action: "UPVOTE_QUESTION",
                        payload: { pin: currentPin, questionId: id }
                    }));
                }
            }
        }

        // Yêu cầu 5: Khởi tạo hệ thống chọn sao Rubric (1-5 sao)
        function initRubricStars() {
            document.querySelectorAll('.stars').forEach(starContainer => {
                starContainer.innerHTML = [1, 2, 3, 4, 5].map(starNum => `
                    <button onclick="setRubricStar(this, ${starNum})" class="text-slate-300 text-xl hover:scale-110 transition">★</button>
                `).join('');
            });
        }

        function setRubricStar(btn, val) {
            const parent = btn.parentElement;
            parent.setAttribute('data-value', val);
            Array.from(parent.children).forEach((child, idx) => {
                child.className = idx < val ? 'text-amber-400 text-xl hover:scale-110 transition' : 'text-slate-300 text-xl hover:scale-110 transition';
            });
        }

        // Gửi điểm Rubric qua WebSocket
        function submitRubric() {
            let results = {};
            let complete = true;
            document.querySelectorAll('.rubric-group').forEach(group => {
                const criterion = group.getAttribute('data-criterion');
                const val = group.querySelector('.stars').getAttribute('data-value');
                if (val == 0) complete = false;
                results[criterion] = parseInt(val);
            });

            if (!complete) {
                alert('Vui lòng chấm đủ sao cho cả 4 tiêu chí trước khi gửi!');
                return;
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: "SUBMIT_RUBRIC",
                    payload: {
                        pin: currentPin,
                        scores: results
                    }
                }));
                alert('Đã gửi kết quả đánh giá Rubric thành công!');
            } else {
                alert('Chưa kết nối được với server!');
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Lắng nghe sự kiện mất mạng / có mạng của trình duyệt
        window.addEventListener('offline', () => updateNetworkStatus('offline'));
        window.addEventListener('online', () => updateNetworkStatus('online'));
    </script>
</body>
</html>
