services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: classlive-ws-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - HEARTBEAT_INTERVAL_MS=30000
    volumes:
      - ./client/src/views:/client/src/views:ro
    restart: unless-stopped
