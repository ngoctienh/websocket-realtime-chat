name: ClassLive Pro CI

on:
  push:
    branches: [ main, master, develop, backend ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-load:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ./server
        run: npm install

      - name: Check syntax & Run RFC 6455 Protocol Integration Tests
        working-directory: ./server
        run: |
          node -c src/index.js
          npm test

      - name: Run 100 Concurrent WebSocket Connections Load Test
        working-directory: ./server
        run: npm run load-test
